name: Repository hygiene

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove verified obsolete branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.EMBI_AUTOMATION_PAT }}
    steps:
      - name: Verify trusted owner token and repository state
        shell: bash
        run: |
          set -euo pipefail

          test -n "${GH_TOKEN}"
          test "$(gh api user --jq .login)" = "${GITHUB_REPOSITORY_OWNER}"

          open_prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length' | awk '{s+=$1} END {print s+0}')"
          test "${open_prs}" = "0"

          expected_branches="$(cat <<'EOF'
          automation/autonomous-maintenance
          automation/autonomous-maintenance-1.0.3
          automation/monthly-day-six-maintenance
          chore/release-branch-trigger
          chore/release-governance
          chore/restore-release-gate
          cleanup/repository-hygiene
          develop
          fix/active-playback-visibility
          fix/dependabot-contract-version-neutral
          fix/protected-release-pipeline
          fix/reliable-autonomous-release
          fix/trusted-autonomous-release
          main
          maintenance/repository-baseline
          release/1.0.2-final
          release/automatic-v1.0.4
          EOF
          )"
          actual_branches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)"
          expected_branches="$(printf '%s\n' "${expected_branches}" | sed 's/^          //' | sort)"
          test "${actual_branches}" = "${expected_branches}"

          ruleset="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/18899268")"
          test "$(jq -r '.name' <<<"${ruleset}")" = "Protect main and develop"
          test "$(jq -c '.conditions.ref_name.include | sort' <<<"${ruleset}")" = '["refs/heads/develop","refs/heads/main"]'

      - name: Reduce protection to canonical main branch
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/rulesets/18899268" |
            jq '{
              name: "Protect main",
              target: .target,
              enforcement: .enforcement,
              bypass_actors: .bypass_actors,
              conditions: {ref_name: {include: ["refs/heads/main"], exclude: []}},
              rules: .rules
            }' |
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/18899268" --input - >/dev/null

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}"             -F delete_branch_on_merge=true >/dev/null

      - name: Delete verified obsolete branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            automation/autonomous-maintenance
            automation/autonomous-maintenance-1.0.3
            automation/monthly-day-six-maintenance
            chore/release-branch-trigger
            chore/release-governance
            chore/restore-release-gate
            cleanup/repository-hygiene
            develop
            fix/active-playback-visibility
            fix/dependabot-contract-version-neutral
            fix/protected-release-pipeline
            fix/reliable-autonomous-release
            fix/trusted-autonomous-release
            maintenance/repository-baseline
            release/1.0.2-final
            release/automatic-v1.0.4
          )

          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          done

      - name: Verify clean repository branch state
        shell: bash
        run: |
          set -euo pipefail

          test "$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')" = "main"
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.delete_branch_on_merge')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/18899268" --jq '.name')" = "Protect main"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/18899268" --jq '.conditions.ref_name.include | join(",")')" = "refs/heads/main"
