name: Workflow registry hygiene

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Disable obsolete workflow registrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.EMBI_AUTOMATION_PAT }}
    steps:
      - name: Disable historical workflow registrations
        shell: bash
        run: |
          set -euo pipefail

          test -n "${GH_TOKEN}"
          test "$(gh api user --jq .login)" = "${GITHUB_REPOSITORY_OWNER}"

          open_prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length' | awk '{s+=$1} END {print s+0}')"
          test "${open_prs}" = "0"

          allowed_paths="$(cat <<'EOF'
          .github/workflows/dependabot-automerge.yml
          .github/workflows/hacs.yml
          .github/workflows/hassfest.yml
          .github/workflows/quality.yml
          .github/workflows/release.yml
          .github/workflows/test-artifact.yml
          .github/workflows/workflow-registry-hygiene.yaml
          dynamic/dependabot/dependabot-updates
          EOF
          )"
          allowed_paths="$(printf '%s\n' "${allowed_paths}" | sed 's/^          //' | sort)"

          workflows="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"

          while IFS=$'\t' read -r workflow_id workflow_path workflow_name; do
            [[ -n "${workflow_id}" ]] || continue
            if ! grep -Fxq "${workflow_path}" <<<"${allowed_paths}"; then
              echo "Deaktiviere historischen Workflow: ${workflow_name} (${workflow_path})"
              gh api --method PUT                 "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" >/dev/null
            fi
          done < <(
            jq -r '.workflows[] | select(.state == "active") | [.id, .path, .name] | @tsv' <<<"${workflows}"
          )

          refreshed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          active_paths="$(
            jq -r '.workflows[] | select(.state == "active") | .path' <<<"${refreshed}" | sort
          )"
          test "${active_paths}" = "${allowed_paths}"

          self_id="$(
            jq -r '.workflows[] | select(.path == ".github/workflows/workflow-registry-hygiene.yaml") | .id'               <<<"${refreshed}"
          )"
          test -n "${self_id}"
          gh api --method PUT             "repos/${GITHUB_REPOSITORY}/actions/workflows/${self_id}/disable" >/dev/null
